<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:#f5f5f5;color:#1a1a1a;height:100vh;display:flex}
#sidebar{width:260px;background:#fff;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;overflow:hidden;transition:width .2s;flex-shrink:0}
#sidebar.collapsed{width:0}
#sidebar-header{padding:14px 16px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between}
#sidebar-header span{font-size:14px;font-weight:600;color:#333}
#sidebar-header button{background:none;border:none;cursor:pointer;color:#999;font-size:16px;padding:2px 6px}
#sidebar-header button:hover{color:#333}
#session-list{flex:1;overflow-y:auto;padding:8px}
.session-item{display:flex;align-items:center;padding:10px 14px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:background .15s}
.session-item:hover{background:#FCEFE8}
.session-item.active{background:#FBE4DA}
.session-item .info{flex:1;min-width:0}
.session-item .title{font-size:13px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item .meta{font-size:11px;color:#999;margin-top:3px}
.session-item .del{visibility:hidden;background:none;border:none;color:#999;cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px;flex-shrink:0}
.session-item:hover .del{visibility:visible}
.session-item .del:hover{color:#dc2626;background:#fee2e2}
#toggle-sidebar{position:fixed;left:260px;top:50%;transform:translateY(-50%);z-index:10;background:#fff;border:1px solid #e5e5e5;border-left:none;border-radius:0 6px 6px 0;cursor:pointer;padding:16px 4px;color:#999;font-size:12px;transition:left .2s}
#toggle-sidebar.shifted{left:0}
#toggle-sidebar:hover{color:#D97757}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{background:#fff;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #e5e5e5;gap:12px}
header .brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
header .brand svg{width:26px;height:26px}
header .brand span{background:linear-gradient(135deg,#D97757,#E8A87C);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .right{margin-left:auto;display:flex;align-items:center;gap:12px}
header .session{font-size:11px;color:#999;font-family:monospace}
#config-select{padding:5px 10px;border-radius:8px;border:1px solid #e0e0e0;font-size:12px;color:#555;background:#fff;cursor:pointer;max-width:220px}
.config-wrap{display:flex;align-items:center;gap:4px}
#config-gear{background:none;border:none;cursor:pointer;color:#999;padding:4px;border-radius:6px;display:flex;align-items:center}
#config-gear:hover{color:#D97757;background:#FCEFE8}
#config-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}
#config-overlay.show{display:flex}
#config-box{background:#fff;border-radius:14px;padding:20px;width:720px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.config-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.config-head h3{font-size:15px;color:#333}
.config-head button{background:none;border:none;font-size:20px;color:#999;cursor:pointer;padding:0 4px}
.config-head button:hover{color:#333}
#config-editor{flex:1;width:100%;min-height:380px;border:1px solid #e0e0e0;border-radius:8px;padding:12px;font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;line-height:1.5;resize:vertical;background:#faf9f8;color:#333}
#config-editor:focus{outline:none;border-color:#D97757}
.config-err{color:#dc2626;font-size:12px;margin-top:8px;display:none;white-space:pre-wrap}
.config-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.config-actions button{padding:9px 18px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid #e0e0e0;background:#fff;color:#555}
.config-actions button:hover{background:#f5f5f5}
.config-actions button.primary{background:#D97757;color:#fff;border:none}
.config-actions button.primary:hover{background:#C05F3C}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* ===== 异形屏安全区（刘海/挖孔/手势条）===== */
:root{
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
header{padding-top:calc(12px + var(--sat))}
#input-area{padding-bottom:calc(16px + var(--sab))}
#messages{padding-left:max(24px,var(--sal));padding-right:max(24px,var(--sar))}

/* ===== 平板（窄屏, 内容区放宽）===== */
@media (min-width:769px) and (max-width:1200px){
  #messages{max-width:100%}
  #input-area{max-width:100%}
}

/* ===== 手机（异形屏全面屏）===== */
@media (max-width:768px){
  body{height:100vh}
  #sidebar{position:fixed;top:0;bottom:0;left:0;z-index:20;width:82vw;max-width:320px;box-shadow:2px 0 16px rgba(0,0,0,.12);transform:translateX(0);transition:transform .22s}
  #sidebar.collapsed{width:82vw;max-width:320px;transform:translateX(-100%)}
  #toggle-sidebar{left:0;top:calc(14px + var(--sat));transform:none;padding:12px 6px;z-index:30;border-radius:0 8px 8px 0}
  #toggle-sidebar.shifted{left:0}
  #main{width:100%}
  header{padding:calc(10px + var(--sat)) 10px 8px;gap:8px}
  header .brand svg{width:22px;height:22px}
  header .brand span{font-size:14px}
  header .session{display:none}
  #config-select{max-width:120px;font-size:11px;padding:5px 6px}
  #messages{max-width:100%;padding:14px 12px calc(14px + var(--sab));gap:12px}
  .msg{max-width:94%}
  #input-area{max-width:100%;padding:8px 12px calc(10px + var(--sab));gap:8px}
  #input-area textarea{font-size:15px;min-height:44px}
  #input-area button{padding:10px 18px}
  #config-box{width:94vw}
  #config-editor{min-height:40vh}
  #config-actions button{padding:11px 20px}
}
#messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;max-width:860px;margin:0 auto;width:100%}
.msg{max-width:85%;line-height:1.7;font-size:14px}
.msg.user{align-self:flex-end;background:#D97757;color:#fff;padding:10px 16px;border-radius:14px 4px 14px 14px;white-space:pre-wrap;word-break:break-word}
.msg.claude{align-self:flex-start;color:#333;width:100%}
.msg.claude .reply-block{background:#fff;padding:12px 18px;border-radius:4px 14px 14px 14px;border:1px solid #eee}
.msg.claude .reply-block :first-child{margin-top:0}
.msg.claude .reply-block :last-child{margin-bottom:0}
.msg.claude .reply-block pre{background:#f6f8fa;border:1px solid #e5e5e5;border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0;font-size:13px;line-height:1.5}
.msg.claude .reply-block code{font-family:'JetBrains Mono',Consolas,monospace;font-size:13px}
.msg.claude .reply-block :not(pre)>code{background:#FCEFE8;color:#D97757;padding:2px 5px;border-radius:4px;font-size:12px}
.msg.claude .reply-block h1,.msg.claude .reply-block h2,.msg.claude .reply-block h3{margin:12px 0 8px}
.msg.claude .reply-block ul,.msg.claude .reply-block ol{padding-left:22px;margin:8px 0}
.msg.claude .reply-block blockquote{border-left:3px solid #D97757;padding:4px 12px;margin:8px 0;color:#666;background:#FDF4F0}
.msg.claude .reply-block table{border-collapse:collapse;margin:8px 0}
.msg.claude .reply-block th,.msg.claude .reply-block td{border:1px solid #e5e5e5;padding:6px 10px;font-size:13px}
.msg.claude .reply-block img{max-width:100%}
.msg .time{font-size:10px;opacity:0.5;margin-top:4px}
.msg.user .time{text-align:right}
.thinking-box{margin-bottom:8px;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;background:#FDF4F0}
.thinking-header{padding:8px 14px;font-size:12px;color:#C25E3C;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
.thinking-header:hover{background:#FCEFE8}
.thinking-header .arrow{transition:transform .2s;font-size:10px}
.thinking-header.open .arrow{transform:rotate(90deg)}
.thinking-body{display:none;padding:10px 14px 14px;font-size:12px;color:#666;line-height:1.6;white-space:pre-wrap;word-break:break-word;border-top:1px solid #e5e5e5;background:#fff;max-height:220px;overflow-y:auto}
.thinking-body.open{display:block}
.tool-list{margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.tool-box{border:1px solid #FDBA74;border-radius:6px;overflow:hidden;background:#FFF7ED;font-size:12px}
.tool-header{padding:5px 10px;color:#9A3412;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;font-weight:600;font-family:monospace}
.tool-header:hover{background:#FFEDD5}
.tool-header .arrow{transition:transform .2s;font-size:10px}
.tool-header.open .arrow{transform:rotate(90deg)}
.tool-name{flex-shrink:0}
.tool-brief{color:#B45309;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-body{display:none;padding:6px 10px;color:#7C2D12;border-top:1px solid #FDBA74;background:#fff;white-space:pre-wrap;word-break:break-all;font-family:monospace;font-size:11px;max-height:150px;overflow-y:auto}
.tool-body.open{display:block}
#input-area{display:flex;padding:16px 24px;background:#fff;gap:12px;border-top:1px solid #e5e5e5;max-width:860px;margin:0 auto;width:100%}
#input-area textarea{flex:1;padding:12px 16px;border-radius:12px;border:1px solid #e0e0e0;background:#f8f8f8;color:#333;resize:none;font-size:14px;min-height:46px;max-height:150px;font-family:inherit}
#input-area textarea:focus{outline:none;border-color:#D97757;background:#fff}
#input-area button{padding:10px 22px;background:#D97757;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
#input-area button:hover{background:#C05F3C}
#input-area button:disabled{opacity:.5;cursor:not-allowed}
.loading{padding:8px 0;color:#999;font-size:13px}
.loading .dots{display:inline-flex;gap:4px;margin-right:6px}
.loading .dots span{width:5px;height:5px;border-radius:50%;background:#D97757;animation:bounce 1.4s infinite;display:inline-block}
.loading .dots span:nth-child(2){animation-delay:.2s}
.loading .dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.4)}40%{transform:scale(1)}}
</style>
</head>

<div id="input-area">
  <textarea id="input" placeholder="发送消息" rows="1"></textarea>
  <button id="send-btn" onclick="send()">发送</button>
</div>
</div>
<script>
(function(){
var MSGS=document.getElementById('messages');
var INPUT=document.getElementById('input');
var BTN=document.getElementById('send-btn');
var SD=document.getElementById('sid-display');
var SLIST=document.getElementById('session-list');
var SIDEBAR=document.getElementById('sidebar');
var TOGGLE=document.getElementById('toggle-sidebar');
var MSELECT=document.getElementById('config-select');
var currentSid=null;

function u4(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0,v=c==='x'?r:r&0x3|0x8;
    return v.toString(16);
  });
}

function getSid(){
  try{var s=localStorage.getItem('cs');if(!s){s=u4();localStorage.setItem('cs',s)}return s}catch(e){return u4()}
}
currentSid=getSid();
SD.textContent=currentSid.slice(0,8)+'...';

function hdrs(json){
  var h={};
  if(json)h['Content-Type']='application/json';
  return h;
}

window.newSession=function(){
  var ns=u4();localStorage.setItem('cs',ns);currentSid=ns;
  SD.textContent=ns.slice(0,8)+'...';MSGS.innerHTML='';
  loadSessions();
};

window.toggleSidebar=function(){
  SIDEBAR.classList.toggle('collapsed');
  TOGGLE.classList.toggle('shifted');
  TOGGLE.innerHTML=SIDEBAR.classList.contains('collapsed')?'&#9654;':'&#9664;';
};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderMd(s){
  if(window.marked&&!window.__markedFailed){
    try{return marked.parse(s)}catch(e){}
  }
  return '<div style="white-space:pre-wrap">'+esc(s)+'</div>';
}

function toolBubble(name,input){
  var inp='';try{inp=JSON.stringify(input)}catch(e){inp=String(input)}
  var brief=inp.length>50?inp.slice(0,50)+'...':inp;
  var t=document.createElement('div');t.className='tool-box';
  t.innerHTML='<div class="tool-header" onclick="var x=this;x.classList.toggle(\'open\');x.nextElementSibling.classList.toggle(\'open\')"><span class="arrow">&#9654;</span><span class="tool-name">'+esc(name)+'</span><span class="tool-brief" title="'+esc(inp)+'">'+esc(brief)+'</span></div><div class="tool-body">'+esc(inp)+'</div>';
  return t;
}

// ---- 流式聊天 ----
var streamState=null;

function startReply(){
  var d=document.createElement('div');d.className='msg claude';
  MSGS.appendChild(d);MSGS.scrollTop=MSGS.scrollHeight;
  streamState={el:d,thinkingBuf:'',replyBuf:'',hasThinking:false,t0:Date.now()};
}

function ensureThinking(){
  if(streamState.tb)return;
  streamState.hasThinking=true;
  var t=document.createElement('div');t.className='thinking-box';
  t.innerHTML='<div class="thinking-header" onclick="var x=this;x.classList.toggle(\'open\');x.nextElementSibling.classList.toggle(\'open\')"><span class="arrow">&#9654;</span><span class="th-title">已思考</span></div><div class="thinking-body"></div>';
  streamState.el.appendChild(t);
  streamState.tb=t.querySelector('.thinking-body');
  streamState.tl=t.querySelector('.thinking-header');
}
function updateThinking(){
  if(!streamState.tb)return;
  streamState.tb.textContent=streamState.thinkingBuf;
  streamState.tl.querySelector('.th-title').textContent='已思考 ('+((Date.now()-streamState.t0)/1000).toFixed(0)+'s)';
}

function ensureReply(){
  if(streamState.rb)return;
  var r=document.createElement('div');r.className='reply-block';
  streamState.el.appendChild(r);
  streamState.rb=r;
  var m=document.createElement('div');m.className='time';
  streamState.el.appendChild(m);streamState.tm=m;
}
function ensureToolsWrap(){
  if(streamState.toolsWrap)return;
  var w=document.createElement('div');w.className='tool-list';
  streamState.el.insertBefore(w,streamState.el.firstChild);
  streamState.toolsWrap=w;
}
function addToolBubble(name,input){
  ensureToolsWrap();
  streamState.toolsWrap.appendChild(toolBubble(name,input));
  MSGS.scrollTop=MSGS.scrollHeight;
}
function updateReplyRaw(){
  if(!streamState.rb)return;
  streamState.rb.textContent=streamState.replyBuf; // 流式期间纯文本, 防 XSS + 天然 pre-wrap
  MSGS.scrollTop=MSGS.scrollHeight;
}
function finishReply(model,duration){
  var s=streamState;
  if(!s)return;
  var hasText=s.replyBuf&&s.replyBuf.trim();
  var hasThink=s.hasThinking&&s.thinkingBuf&&s.thinkingBuf.trim();
  if(!hasText&&!hasThink){
    // 无思考无文字（纯工具调用），移除空气泡
    if(s.el&&s.el.parentNode)s.el.remove();
    streamState=null;
    return;
  }
  if(hasThink&&s.tb)s.tb.innerHTML=renderMd(s.thinkingBuf);
  if(!hasText){
    // 只有思考无文字回复：保留 thinking 折叠，不渲染空回复
    if(s.rb){s.rb.remove();s.rb=null}
    if(s.tm){s.tm.remove();s.tm=null}
  }else{
    ensureReply();
    s.rb.innerHTML=renderMd(s.replyBuf);
    var line='';
    if(model)line+=model+' | ';
    if(duration)line+=(duration/1000).toFixed(1)+'s | ';
    line+=new Date().toLocaleTimeString();
    if(s.tm)s.tm.textContent=line;
  }
  MSGS.scrollTop=MSGS.scrollHeight;
  streamState=null;
}

function parseSSEBlock(block){
  if(!block||block==='\n')return;
  var ev='message',data='';
  var lines=block.split('\n');
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(l.indexOf('event:')===0)ev=l.slice(6).trim();
    else if(l.indexOf('data:')===0)data+=l.slice(5).trim();
  }
  if(!data)return;
  var obj;try{obj=JSON.parse(data)}catch(e){return}
  if(ev==='thinking'){streamState.thinkingBuf+=obj.delta||'';ensureThinking();updateThinking();MSGS.scrollTop=MSGS.scrollHeight;}
  else if(ev==='text'){streamState.replyBuf+=obj.delta||'';ensureReply();updateReplyRaw();}
  else if(ev==='tool'){addToolBubble(obj.name,obj.input);}
  else if(ev==='done'){finishReply(obj.model,obj.duration_ms);}
  else if(ev==='error'){rmLoad();addErr(obj.message||'出错了');streamState=null;}
}

window.send=function(){
  var t=INPUT.value.trim();if(!t)return;
  INPUT.value='';INPUT.style.height='auto';BTN.disabled=true;
  addUser(t);addLoading();startReply();
  var body={message:t,session_id:currentSid};
  if(MSELECT.value)body.config=MSELECT.value;
  fetch('/api/chat/stream',{method:'POST',headers:hdrs(true),body:JSON.stringify(body)})
  .then(function(r){
    if(!r.ok||!r.body)return r.json().then(function(d){throw new Error(d.error||'请求失败')});
    var reader=r.body.getReader(),decoder=new TextDecoder(),buf='';
    function pump(){
      return reader.read().then(function(res){
        if(res.done){finishReply(null,null);return}
        buf+=decoder.decode(res.value,{stream:true});
        var parts=buf.split('\n\n');
        buf=parts.pop();
        for(var i=0;i<parts.length;i++)parseSSEBlock(parts[i]);
        return pump();
      });
    }
    return pump();
  })
  .catch(function(e){
    rmLoad();if(streamState){streamState.el.remove();streamState=null}
    addErr('错误: '+e.message);
  })
  .then(function(){BTN.disabled=false;INPUT.focus();loadSessions()});
};

function addUser(text){
  var d=document.createElement('div');d.className='msg user';
  d.innerHTML=esc(text)+'<div class="time">'+new Date().toLocaleTimeString()+'</div>';
  MSGS.appendChild(d);MSGS.scrollTop=MSGS.scrollHeight;
}

function addErr(text){
  var d=document.createElement('div');d.style.color='#dc2626';d.style.padding='8px 0';
  d.textContent=text;MSGS.appendChild(d);
}

function addLoading(){
  var d=document.createElement('div');d.className='loading';d.id='ldr';
  d.innerHTML='<div class="dots"><span></span><span></span><span></span></div>思考中...';
  MSGS.appendChild(d);MSGS.scrollTop=MSGS.scrollHeight;
}
function rmLoad(){var e=document.getElementById('ldr');if(e)e.remove()}

// ---- 会话列表 ----
function fmtTime(ms){
  // 后端 os.path.getmtime 返回秒级时间戳, 需 *1000 转毫秒
  var t=ms*1000,d=new Date(t),now=new Date();
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(t>today)return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  if(t>today-86400000)return '昨天';
  return d.toLocaleDateString('zh-CN');
}

function loadSessions(){
  fetch('/api/sessions',{headers:hdrs()})
  .then(function(r){return r.json()})
  .then(function(list){
    SLIST.innerHTML='';
    for(var i=0;i<list.length;i++){
      var s=list[i];
      var div=document.createElement('div');
      div.className='session-item'+(s.id===currentSid?' active':'');
      div.innerHTML='<div class="info"><div class="title">'+esc(s.first_msg||'(空)')+'</div><div class="meta">'+s.msg_count+' 条 · '+fmtTime(s.updated)+'</div></div><button class="del" title="删除会话">×</button>';
      div.querySelector('.info').onclick=(function(sid){return function(){loadSession(sid)}})(s.id);
      div.querySelector('.del').onclick=function(e){
        e.stopPropagation();
        if(!confirm('删除该会话?'))return;
        fetch('/api/sessions/'+s.id,{method:'DELETE',headers:hdrs()})
        .then(function(r){return r.json()})
        .then(function(d){if(d.ok&&s.id===currentSid)newSession();else loadSessions()});
      };
      SLIST.appendChild(div);
    }
  }).catch(function(e){
    SLIST.innerHTML='<div style="color:red;font-size:12px;padding:10px">加载失败: '+esc(String(e))+'</div>';
  });
}

function loadSession(sid_){
  currentSid=sid_;localStorage.setItem('cs',sid_);
  SD.textContent=sid_.slice(0,8)+'...';
  MSGS.innerHTML='';
  fetch('/api/sessions/'+sid_)
  .then(function(r){return r.json()})
  .then(function(data){
    if(data.error){addErr(data.error);return}
    var msgs=data.msgs||[];
    for(var i=0;i<msgs.length;i++){
      var m=msgs[i];
      if(m.role==='user')addUser(m.content);
      else{
        var d=document.createElement('div');d.className='msg claude';
        var hasT=m.thinking&&m.thinking.trim();
        var hasC=m.content&&m.content.trim();
        if(m.tools&&m.tools.length){
          var w=document.createElement('div');w.className='tool-list';
          for(var ti=0;ti<m.tools.length;ti++)w.appendChild(toolBubble(m.tools[ti].name,m.tools[ti].input));
          d.appendChild(w);
        }
        if(hasT){var t=document.createElement('div');t.className='thinking-box';t.innerHTML='<div class="thinking-header" onclick="var x=this;x.classList.toggle(\'open\');x.nextElementSibling.classList.toggle(\'open\')"><span class="arrow">&#9654;</span>已思考</div><div class="thinking-body"></div>';t.querySelector('.thinking-body').innerHTML=renderMd(m.thinking);d.appendChild(t);}
        if(hasC){var r=document.createElement('div');r.className='reply-block';r.innerHTML=renderMd(m.content);d.appendChild(r);}
        if(d.childNodes.length)MSGS.appendChild(d);
      }
    }
    MSGS.scrollTop=MSGS.scrollHeight;
    loadSessions();
  });
}

// ---- 配置下拉（后端 provider 选择）----
function loadConfigs(){
  fetch('/api/configs',{headers:hdrs()})
  .then(function(r){return r.json()})
  .then(function(list){
    var saved=localStorage.getItem('cw_config')||'';
    MSELECT.innerHTML='';
    for(var i=0;i<list.length;i++){
      var o=document.createElement('option');o.value=list[i].key;o.textContent=list[i].label;MSELECT.appendChild(o);
    }
    var add=document.createElement('option');add.value='__add__';add.textContent='＋ 添加配置';MSELECT.appendChild(add);
    var hasSaved=!!saved&&list.some(function(c){return c.key===saved});
    if(hasSaved)MSELECT.value=saved;
    else if(list.length)MSELECT.value=list[0].key;
  });
}
MSELECT.addEventListener('change',function(){
  if(MSELECT.value==='__add__'){
    openAddConfig();
    var saved=localStorage.getItem('cw_config');
    if(saved)MSELECT.value=saved;
    else if(MSELECT.options.length>1)MSELECT.value=MSELECT.options[0].value;
    else MSELECT.selectedIndex=0;
    return;
  }
  localStorage.setItem('cw_config',MSELECT.value);
});

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove('show')},2000);
}

function showConfigEditor(title, content){
  document.getElementById('config-title').textContent=title;
  document.getElementById('config-editor').value=content;
  document.getElementById('config-err').style.display='none';
  document.getElementById('config-overlay').classList.add('show');
}

window.openConfigEditor=function(){
  fetch('/api/config',{headers:hdrs()})
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.ok)showConfigEditor('编辑配置文件 (providers.json)',d.content);
    else toast(d.error||'读取配置失败');
  })
  .catch(function(e){toast('读取配置失败: '+e.message)});
};

window.openAddConfig=function(){
  fetch('/api/config',{headers:hdrs()})
  .then(function(r){return r.json()})
  .then(function(d){
    if(!d.ok){toast(d.error||'读取配置失败');return}
    var obj;
    try{obj=JSON.parse(d.content)}catch(e){toast('现有配置解析失败');return}
    var next=(obj.providers?Object.keys(obj.providers).length:0)+1;
    var key='config'+next;
    obj.providers[key]={
      'label':'配置'+next+' - 新后端',
      'base_url':'https://api.example.com/anthropic',
      'auth_token':'sk-你的API密钥',
      'default_model':'your-model',
      'effort':'medium',
      'toolsearch':false,
      'teammate':true,
      'models':['your-model'],
      'mapping':{'opus':'your-model','sonnet':'your-model','haiku':'your-model'}
    };
    showConfigEditor('添加配置 ('+key+') — 编辑模板后保存',JSON.stringify(obj,null,2));
  })
  .catch(function(e){toast('读取配置失败: '+e.message)});
};

window.closeConfigEditor=function(){
  document.getElementById('config-overlay').classList.remove('show');
};

window.saveConfig=function(){
  var content=document.getElementById('config-editor').value;
  var err=document.getElementById('config-err');
  err.style.display='none';
  fetch('/api/config',{method:'POST',headers:hdrs(true),body:JSON.stringify({content:content})})
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.ok){
      document.getElementById('config-overlay').classList.remove('show');
      loadConfigs();
      toast('配置已保存');
    }else{
      err.textContent=d.error||'保存失败';
      err.style.display='block';
    }
  })
  .catch(function(e){err.textContent='保存失败: '+e.message;err.style.display='block'});
};

INPUT.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
INPUT.addEventListener('input',function(){INPUT.style.height='auto';INPUT.style.height=Math.min(INPUT.scrollHeight,150)+'px'});

// init
if(window.innerWidth<=768){
  // 移动端默认折叠侧边栏（抽屉模式）
  SIDEBAR.classList.add('collapsed');
  TOGGLE.classList.add('shifted');
  TOGGLE.innerHTML='&#9654;';
}
loadConfigs();
loadSessions();
})();
</script>
<div id="config-overlay">
  <div id="config-box">
    <div class="config-head">
      <h3 id="config-title">编辑配置文件</h3>
      <button onclick="closeConfigEditor()" title="关闭">×</button>
    </div>
    <textarea id="config-editor" spellcheck="false"></textarea>
    <div id="config-err" class="config-err"></div>
    <div class="config-actions">
      <button onclick="closeConfigEditor()">取消</button>
      <button onclick="saveConfig()" class="primary">保存</button>
    </div>
  </div>
</div>
<div id="toast"></div>
</body>
</html>
